databases:
  - name: rottenpotatoes-db
    databaseName: rottenpotatoes
    user: rottenpotatoes
    plan: free

services:
  - type: web
    name: rottenpotatoes
    runtime: ruby
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rottenpotatoes-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: enabled
      - key: RAILS_SERVE_STATIC_FILES
        value: enabled
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY_BASE
        generateValue: true
